# ============================================================
# netlify.toml — Configuración de Cinetra para Netlify
# ============================================================

[build]
  publish = "."

# Redirige cualquier ruta desconocida al index (SPA)
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Headers de seguridad
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

# Protege el admin con Basic Auth de Netlify (capa extra de seguridad)
# Podés activarlo en Netlify Dashboard → Site Settings → Access Control
# [[headers]]
#   for = "/admin.html"
#   [headers.values]
#     Basic-Auth = "admin:TU_CONTRASEÑA"
